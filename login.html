<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ingreso · Sistema Interno ECIEM</title>
<link rel="stylesheet" href="css/ucn.css">
</head>
<body>
<div id="login-wrap">
  <div class="login-card">
    <h1>Sistema Interno ECIEM</h1>
    <p>Universidad Católica del Norte</p>
    <input id="user" placeholder="Usuario" autocomplete="username">
    <input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button class="btn" id="entrar">Ingresar</button>
    <div class="login-err" id="err"></div>
  </div>
</div>
<script src="settings.js"></script>
<script src="config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  (async()=>{ if (await API.me()) location.href="index.html"; })();
  const go = async ()=>{
    err.textContent="";
    try{
      const ok = await Auth.login(user.value.trim(), pass.value);
      if(ok) location.href="index.html";
      else err.textContent="Credenciales inválidas";
    }catch(e){ err.textContent="No se pudo conectar al servidor"; }
  };
  document.getElementById("entrar").onclick=go;
  document.getElementById("pass").addEventListener("keydown",e=>{if(e.key==="Enter")go();});
</script>
</body>
</html>
